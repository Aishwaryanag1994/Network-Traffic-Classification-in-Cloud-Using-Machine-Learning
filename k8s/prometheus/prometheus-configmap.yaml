apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s

    scrape_configs:
      # App metrics (already working)
      - job_name: 'traffic-classifier'
        metrics_path: /metrics
        static_configs:
          - targets: ['traffic-classifier-svc.default.svc.cluster.local:8000']

      # Kubelet (node) metrics
      - job_name: 'kubelet'
        scheme: https
        kubernetes_sd_configs:
          - role: node
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: replace
            source_labels: [__meta_kubernetes_node_address_InternalIP]
            regex: (.*)
            target_label: __address__
            replacement: ${1}:10250

      # cAdvisor (per-container CPU/Memory)
      - job_name: 'kubelet-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: replace
            source_labels: [__meta_kubernetes_node_address_InternalIP]
            regex: (.*)
            target_label: __address__
            replacement: ${1}:10250
