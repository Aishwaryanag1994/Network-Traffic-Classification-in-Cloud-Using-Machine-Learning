apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
    grafana_dashboard: "1"
data:
  traffic-classifier-dashboard.json: |
    {
      "title": "Traffic Classifier / System Overview",
      "timezone": "browser",
      "panels": [
        {
          "type": "graph",
          "title": "CPU (classifier pods)",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"traffic-classifier-.*\"}[5m]))",
              "legendFormat": "CPU"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "graph",
          "title": "Memory (classifier pods)",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{pod=~\"traffic-classifier-.*\"})",
              "legendFormat": "Mem"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "graph",
          "title": "Requests per second (if exported)",
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m]))",
              "legendFormat": "RPS"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          }
        },
        {
          "type": "graph",
          "title": "Model inference latency p95 (if exported)",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(inference_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          }
        }
      ],
      "schemaVersion": 37,
      "version": 1
    }