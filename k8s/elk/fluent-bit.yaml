apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    debug
        Parsers_File parsers.conf

    [INPUT]
        Name                  tail
        Path                  /var/log/containers/*.log
        Parser                docker
        Tag                   kube.*
        Refresh_Interval      5
        Mem_Buf_Limit         50MB
        Skip_Long_Lines       On
        Rotate_Wait           30
        Read_From_Head        On

    [FILTER]
        Name          kubernetes
        Match         kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Kube_URL      https://kubernetes.default.svc:443
        Merge_Log     On
        Keep_Log      Off
        Annotations   Off

    [OUTPUT]
        Name            es
        Match           *
        Host            elasticsearch.logging.svc.cluster.local
        Port            9200
        Index           fluent-bit
        Logstash_Format On
        Replace_Dots    On
        Retry_Limit     False
        Suppress_Type_Name  On

        Trace_Error     On

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
    
      terminationGracePeriodSeconds: 10
      serviceAccountName: fluent-bit 
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:2.1
          resources:
            requests: { cpu: "100m", memory: "100Mi" }
            limits:   { memory: "200Mi" }
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit-config
